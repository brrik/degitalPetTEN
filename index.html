<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>デジタルペット TEN</title>
</head>
<body>
    <h1>デジタルペット TEN</h1>
    <div>
        <p>TENは、時間の経過でどんどん大きく成長します。</p>
        <p>でも、24時間放置するとTENは小さく戻ってしまいます。</p>
        <p>たくさん見に来て、大きく育ててあげてください。</p>
        <p>いまのTENのサイズ：<span id="tenSize">0</span></p>
        <input type="text" id="inputText" placeholder="TENの色：英数字">
    </div>
    <div id="player"></div>
    <button onclick="clickShuffle()">音楽シャッフル</button>
    <div>   
        <canvas id="mainCanvas" width="200" height="200"></canvas>
    </div>
    <div id="resetButton"><button onclick="resetDataSize()">リセット</button></div>
    <script src="script.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
